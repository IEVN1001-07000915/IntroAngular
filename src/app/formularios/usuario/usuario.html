<div class="container">
    <div class="row">
        <div class="col-6">
            <form>
                <div class="mb-4 pt-4">
                    <label for="IngresaUsuario">Ingrese el usuario:</label>
                    <input [(ngModel)]="IngresaUsuario" name="IngresaUsuario" type="text" class="form-control" id="IngresaUsuario" placeholder="Ingrese usuario">
                </div>
                <div class="form-group pt-4">
                    <label for="IngresaContra">Ingrese la contraseña:</label>
                    <input [(ngModel)]="IngresaContra" name="IngresaContra" type="password" class="form-control" id="IngresaContra" placeholder="Ingrese contraseña">
                </div>

                <br>
                <button (click)="Validar()" type="button" class="btn btn-primary">
                    Login
                </button>
            </form>
        </div>
        <div class="col-6 pt-4">
            <h2>Mensaje: {{mensaje}}</h2>
        </div>
    </div>
</div>
